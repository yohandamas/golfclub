<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의리 골프클럽 (가제)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1B2430;
    --fairway:#16332A;
    --fairway-2:#20493B;
    --moss:#4E7C59;
    --scorecard:#F4EFE3;
    --scorecard-line:#DCD3BC;
    --gold:#C8A64B;
    --clay:#B8763E;
    --paper:#FAFAF7;
    --danger:#A8432F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    padding-bottom:72px;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed','Pretendard',sans-serif;
    letter-spacing:.02em; text-transform:uppercase; font-weight:700;
  }
  .num{ font-family:'Space Mono', monospace; font-variant-numeric: tabular-nums; }

  /* ---- Header ---- */
  header.top{
    background:var(--fairway); color:#fff; padding:18px 20px 22px;
    border-radius:0 0 22px 22px; text-align:center;
  }
  header.top .row{ justify-content:center; }
  header.top .eyebrow{ font-size:12px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; }
  header.top h1{ margin:4px 0 0; font-size:28px; }
  header.top .sub{ font-size:13px; opacity:.75; margin-top:2px; }
  .me-badge{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    background:rgba(255,255,255,.1); padding:6px 12px; border-radius:999px; font-size:13px;
  }
  .profile-bar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pf-pill{
    background:rgba(255,255,255,.1); color:#fff; padding:6px 14px; border-radius:999px;
    font-size:12.5px; border:none; display:inline-flex; align-items:center; gap:5px;
  }
  .pf-pill.pf-edit{ background:var(--moss); font-weight:700; cursor:pointer; }
  .pf-pill.pf-logout{ background:rgba(255,255,255,.06); opacity:.7; cursor:pointer; }
  .pf-pill.pf-name{ background:rgba(200,166,75,.25); color:var(--gold); font-weight:700; }
  .pf-pill.pf-role{ background:rgba(184,118,62,.32); color:#ffd9b0; font-weight:700; }
  .pf-pill.pf-group{ background:rgba(255,255,255,.08); color:rgba(255,255,255,.75); }
  .tier-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .tier-0{ background:var(--gold); } .tier-1{ background:#7FB3D5; }
  .tier-2{ background:var(--moss); } .tier-3{ background:#9A9A9A; }
  .tier-none{ background:#555; }

  /* ---- Nav tabs ---- */
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid #e7e4da; display:flex; z-index:50;
  }
  nav.tabs button{
    flex:1; border:none; background:none; padding:10px 4px 8px; font-size:11px;
    color:#8b8b83; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabs button.active{ color:var(--fairway); font-weight:700; }
  nav.tabs button .ic{ font-size:18px; }

  main{ padding:16px; max-width:640px; margin:0 auto; }
  section{ display:none; }
  section.active{ display:block; }

  .card{
    background:#fff; border:1px solid #ece8dc; border-radius:var(--radius);
    padding:14px 16px; margin-bottom:12px;
  }
  .card h3{ margin:0 0 8px; font-size:18px; color:var(--fairway); }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .muted{ color:#8a8a80; font-size:12.5px; }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; }
  .pill.정기{ background:#EAF3EC; color:var(--moss); }
  .pill.백세클럽,.pill.100세클럽{ background:#F3EBDD; color:var(--clay); }
  .pill.제외{ background:#F1EFEC; color:#9a9a90; }
  .pill.예약완료{ background:var(--fairway); color:#fff; }
  .pill.미정{ background:#eee; color:#777; }

  /* ---- Scorecard signature component ---- */
  .scorecard{
    background:var(--scorecard); border:1px solid var(--scorecard-line);
    border-radius:10px; padding:10px 12px; display:flex; gap:6px; overflow-x:auto;
  }
  .scorecard .cell{
    min-width:34px; text-align:center; padding:6px 0; border-radius:6px;
    background:#fff; border:1px solid var(--scorecard-line); font-size:13px;
  }
  .scorecard .cell .d{ font-size:9px; color:#9a9484; }
  .scorecard .cell .s{ font-weight:700; }
  .scorecard .cell.best{ background:var(--gold); color:#3a2f10; border-color:var(--gold); }

  button.btn{
    border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13.5px;
    background:var(--fairway); color:#fff; cursor:pointer;
  }
  button.btn.ghost{ background:#fff; color:var(--fairway); border:1px solid var(--fairway); }
  button.btn.ghost.view-active{ background:var(--fairway); color:#fff; }
  .group-header{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px;
    color:var(--fairway); margin:14px 2px 6px; letter-spacing:.03em;
  }
  button.btn.small{ padding:6px 10px; font-size:12px; }
  button.status-btn{
    border:1px solid #ddd; background:#fff; border-radius:999px; padding:5px 10px; font-size:12px;
  }
  button.status-btn.on.참석{ background:var(--moss); color:#fff; border-color:var(--moss); }
  button.status-btn.on.대기{ background:var(--clay); color:#fff; border-color:var(--clay); }
  button.status-btn.on.불참{ background:#999; color:#fff; border-color:#999; }

  input, select, textarea{
    width:100%; padding:9px 10px; border:1px solid #ddd8c8; border-radius:9px;
    font-size:14px; font-family:inherit; margin-bottom:8px; background:#fff;
  }
  label.f{ font-size:12px; color:#8a8a80; margin-bottom:2px; display:block; }

  .tier-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:999px; color:#fff;
  }
  .tier-badge.tier-0{ background:var(--gold); color:#3a2f10; }
  .tier-badge.tier-1{ background:#5A8FB0; }
  .tier-badge.tier-2{ background:var(--moss); }
  .tier-badge.tier-3{ background:#8b8b83; }
  .tier-badge.tier-none{ background:#c9c4b4; color:#555; }

  #loginScreen{
    position:fixed; inset:0; background:rgba(10,20,15,.55);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:100;
  }
  #loginScreen.open{ display:flex; }
  #loginScreen .box{
    max-width:360px; margin:0 auto; width:100%; background:var(--fairway); color:#fff;
    border-radius:18px; padding:24px; position:relative;
  }
  #loginScreen .close{
    position:absolute; top:14px; right:16px; background:none; border:none; color:#fff;
    font-size:20px; cursor:pointer; opacity:.7;
  }
  #loginScreen input{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.25); color:#fff; }
  #loginScreen input::placeholder{ color:rgba(255,255,255,.5); }
  #loginError{ color:#ffb4a3; font-size:13px; min-height:18px; }
  .locked-note{ text-align:center; padding:30px 14px; color:#8a8a80; font-size:13.5px; }

  body.dark{
    --paper:#121815; --ink:#EDEDE5; --fairway:#0E241C; --fairway-2:#173327;
    --scorecard:#22281F; --scorecard-line:#3a4038;
  }
  body.dark .card{ background:#1A211C; border-color:#2b332c; }
  body.dark input, body.dark select, body.dark textarea{ background:#1A211C; color:#EDEDE5; border-color:#3a4038; }
  body.dark nav.tabs{ background:#1A211C; border-color:#2b332c; }
  body.dark .scorecard .cell{ background:#242b23; border-color:#3a4038; color:#EDEDE5; }
  body.text-lg{ font-size:17px; }
  body.text-lg header.top h1{ font-size:32px; }
  body.text-lg .card h3{ font-size:20px; }
  .empty{ text-align:center; padding:30px 10px; color:#9a9a90; font-size:13.5px; }
  .rank-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f0ede2; }
  .rank-row .n{ width:22px; text-align:center; font-weight:700; color:var(--fairway); }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:10px; }
  .cal-dow{ text-align:center; font-size:11px; color:#9a9a90; padding:4px 0; }
  .cal-day{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; font-size:13px; cursor:pointer; gap:2px;
  }
  .cal-day:not(.blank):hover{ background:#f2f0e6; }
  .cal-day.blank{ cursor:default; }
  .cal-day.today{ background:var(--fairway); color:#fff; font-weight:700; }
  .cal-day.selected{ outline:2px solid var(--gold); }
  .cal-day .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); }
  body.dark .cal-day:not(.blank):hover{ background:#242b23; }

  .seg-control{ display:flex; background:#EEE; border-radius:12px; padding:4px; gap:4px; }
  .seg-control button{
    flex:1; border:none; background:none; padding:10px 4px; border-radius:9px;
    font-size:13px; font-weight:700; color:#8a8a80; cursor:pointer;
  }
  .seg-control button.view-active{ background:var(--fairway); color:#fff; }
  body.dark .seg-control{ background:#1A211C; }
  body.dark .seg-control button{ color:#8a8a80; }
</style>
</head>
<body>

<!-- ================= LOGIN (모달) ================= -->
<div id="loginScreen">
  <div class="box">
    <button class="close" onclick="closeLoginModal()">✕</button>
    <div class="eyebrow" style="color:var(--gold);letter-spacing:.18em;font-size:12px;">의리 골프클럽 (가제)</div>
    <h1 style="margin:6px 0 18px;">회원 로그인</h1>
    <label class="f" style="color:rgba(255,255,255,.6)">이름 (목록에서 선택 또는 직접 입력)</label>
    <select id="namePicker" onchange="document.getElementById('loginName').value=this.value" style="margin-bottom:6px;">
      <option value="">-- 회원 목록 --</option>
    </select>
    <input id="loginName" placeholder="예) 서힘찬">
    <label class="f" style="color:rgba(255,255,255,.6)">비밀번호 (초기값 0001)</label>
    <input id="loginPw" type="password" placeholder="••••">
    <div id="loginError"></div>
    <button class="btn" style="width:100%;margin-top:8px;background:var(--gold);color:#2b2308;" onclick="doLogin()">로그인</button>
    <div style="margin:16px 0 6px;border-top:1px solid rgba(255,255,255,.15);"></div>
    <label class="f" style="color:rgba(255,255,255,.6)">처음이신가요? 이름으로 바로 등록</label>
    <input id="regName" placeholder="실명 입력">
    <button class="btn ghost" style="width:100%;background:none;border-color:rgba(255,255,255,.4);color:#fff;" onclick="doSelfRegister()">회원 등록 (초기비번 0001)</button>
  </div>
</div>

<!-- ================= APP (로그인 없이도 조회 가능) ================= -->
<div id="app">
  <header class="top">
    <div class="row" style="gap:6px;flex-wrap:wrap;">
      <button class="btn small ghost" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);" onclick="quickChangePw()">🔑 비번변경</button>
      <button class="btn small ghost" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);" onclick="toggleFontSize()">🔤 글자크기</button>
      <button class="btn small ghost" style="background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.3);" onclick="toggleTheme()">☀️/🌙 테마</button>
    </div>
    <div class="eyebrow" id="eyebrowTitle" style="margin-top:10px;">의리 골프클럽 (가제)</div>
    <h1 id="headerTitle">이번 주</h1>
    <div class="sub">03월~12월 매주 수요일 정기 라운딩 · <span id="versionTag" class="num"></span></div>
    <div class="row" style="margin-top:12px;">
      <div class="profile-bar" id="profileBar" style="display:none;">
        <span class="pf-pill pf-name" id="pfName"></span>
        <span class="pf-pill" id="pfTier"></span>
        <span class="pf-pill pf-role" id="pfRole"></span>
        <span class="pf-pill pf-group" id="pfGroup"></span>
        <button class="pf-pill pf-edit" onclick="editProfile()">변경</button>
        <button class="pf-pill pf-logout" onclick="logout()">로그아웃</button>
      </div>
      <button class="btn small" id="loginNavBtn" style="background:var(--gold);color:#2b2308;" onclick="openLoginModal()">로그인</button>
    </div>
  </header>

  <main>
    <!-- 홈 -->
    <section id="tab-home" class="active">
      <div class="card" id="noticeCard" style="background:var(--fairway-2);color:#fff;border:none;"></div>

      <div class="card">
        <div class="row">
          <button class="btn small ghost" onclick="calMonthShift(-1)">‹</button>
          <h3 id="calTitle" style="margin:0;">달력</h3>
          <button class="btn small ghost" onclick="calMonthShift(1)">›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
        <div class="row" style="margin-top:8px;">
          <button class="btn small ghost" onclick="calGoToday()">오늘로 이동</button>
          <span class="muted" style="font-size:11.5px;">🟡 표시된 날 = 일정 있음</span>
        </div>
      </div>

      <div class="card" style="padding:10px;">
        <div class="seg-control">
          <button id="viewBtn-month" onclick="setScheduleView('month')">월별보기</button>
          <button id="viewBtn-quarter" onclick="setScheduleView('quarter')">분기보기</button>
          <button id="viewBtn-year" onclick="setScheduleView('year')">연간보기</button>
        </div>
      </div>
      <div id="scheduleList"></div>

      <div class="card" id="scheduleAddCard">
        <div class="row"><h3 style="margin:0">일정 추가</h3></div>
        <label class="f">날짜</label><input id="fDate" type="date">
        <label class="f">이벤트 타입</label>
        <select id="fType"><option>정기</option><option>백세클럽</option><option>100세클럽</option><option>제외</option></select>
        <label class="f">Cc (골프장/코스명)</label><input id="fCourse" placeholder="예) 로제비앙 비앙코스">
        <label class="f">행정구역</label><input id="fRegion" placeholder="예) 경기도 남양주">
        <label class="f">티업 (시간)</label><input id="fTee" placeholder="예) 16:59">
        <label class="f">시간대</label>
        <select id="fSlot"><option value="">-</option><option>야간</option><option>주간</option></select>
        <label class="f">구성원 / 메모</label><input id="fNote" placeholder="예) 김충기,최은상,방대한 · 4인필수 · 그린피 15만">
        <button class="btn" onclick="addSchedule()">일정 등록</button>
      </div>
    </section>

    <!-- 랭킹 -->
    <section id="tab-rank">
      <div class="card">
        <div class="row">
          <h3 style="margin:0">등급 · 랭킹</h3>
          <select id="tierFilter" style="width:auto;margin:0" onchange="loadRanking()">
            <option value="all">전체 등급</option>
            <option value="0">0티어 (≤85)</option>
            <option value="1">1티어 (86~95)</option>
            <option value="2">2티어 (96~105)</option>
            <option value="3">3티어 (106~)</option>
          </select>
        </div>
        <div id="rankList" style="margin-top:8px;"></div>
      </div>
    </section>

    <!-- 마이/회원 -->
    <section id="tab-members">
      <div class="card">
        <label class="f">회원 선택 (기본: 나)</label>
        <select id="memberPicker" onchange="loadMemberView()"></select>
      </div>

      <div id="selfPanel">
        <div class="card">
          <h3>내 등급</h3>
          <div id="myTierBox"></div>
        </div>
        <div class="card">
          <div class="row"><h3 style="margin:0">스코어 등록</h3></div>
          <label class="f">날짜</label><input id="rDate" type="date">
          <label class="f">코스</label><input id="rCourse" placeholder="예) 남양주 파랑새">
          <label class="f">스코어</label><input id="rScore" type="number" placeholder="예) 97">
          <button class="btn" onclick="submitRound()">등록</button>
        </div>
        <div class="card">
          <h3>최근 라운드</h3>
          <div id="myScorecard" class="scorecard"></div>
          <div id="myHistory" style="margin-top:10px;"></div>
        </div>
        <div class="card">
          <h3>비밀번호 변경</h3>
          <input id="newPw" type="password" placeholder="새 비밀번호">
          <button class="btn ghost" onclick="changePw()">변경하기</button>
        </div>
      </div>

      <div id="otherPanel" style="display:none;">
        <div class="card">
          <div class="row"><h3 style="margin:0" id="otherName"></h3><span class="tier-badge" id="otherTierBadge"></span></div>
          <div class="scorecard" id="otherScorecard" style="margin-top:8px;"></div>
        </div>
      </div>
    </section>

    <!-- 관리자 -->
    <section id="tab-admin">
      <h2 style="font-size:20px;margin:4px 0 10px;">🔒 운영패널</h2>
      <div class="card">
        <h3>클럽 명칭</h3>
        <input id="cfgClubName" placeholder="예) 의리 골프클럽">
        <button class="btn" onclick="saveClubName()">저장</button>
      </div>
      <div class="card">
        <h3>회원 관리</h3>
        <div id="adminMembers"></div>
      </div>
      <div class="card">
        <h3>등급 기준값</h3>
        <label class="f">0티어 상한</label><input id="cfgT0" type="number">
        <label class="f">1티어 상한</label><input id="cfgT1" type="number">
        <label class="f">2티어 상한</label><input id="cfgT2" type="number">
        <button class="btn" onclick="saveTierBounds()">저장</button>
      </div>
      <div class="card">
        <h3>공지 / 매너 안내 (AI 관리자 댓글)</h3>
        <input id="noticeInput" placeholder="예) 의리합시다, 의리! 라운딩 30분 전 도착은 매너입니다">
        <button class="btn" onclick="addNotice()">등록</button>
        <div id="noticeAdminList" style="margin-top:10px;"></div>
      </div>
      <div class="card">
        <h3>업데이트 내역</h3>
        <div id="updateLog"></div>
      </div>
    </section>
  </main>

  <nav class="tabs">
    <button class="active" data-tab="home" onclick="showTab('home')"><span class="ic">🏠</span>홈</button>
    <button data-tab="rank" onclick="showTab('rank')"><span class="ic">🏆</span>랭킹</button>
    <button data-tab="members" onclick="showTab('members')"><span class="ic">👤</span>마이/회원</button>
    <button id="adminTabBtn" data-tab="admin" onclick="showTab('admin')" style="display:none"><span class="ic">🔒</span>관리자</button>
  </nav>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ⚠️ 여기에 실제 Supabase 프로젝트 값 입력
const SUPABASE_URL = 'https://qfrrshpqvvglzxankycq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ge73xpuuqWqblTW82xwyCg_G3E2z4Kh';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
window.supabase = supabase;

const SITE_VERSION = 'v1.9';

window.doLogin = async function(){
  const name = document.getElementById('loginName').value.trim();
  const pw = document.getElementById('loginPw').value.trim();
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!name || !pw){ err.textContent='이름과 비밀번호를 입력하세요.'; return; }
  const { data, error } = await supabase.rpc('verify_login', { p_name: name, p_password: pw });
  if(error) console.error('login error', error);
  if(error || !data || data.length===0){ err.textContent='이름 또는 비밀번호가 올바르지 않습니다. (Supabase 연결/이름 철자를 확인해보세요)'; return; }
  me = data[0];
  sessionStorage.setItem('me', JSON.stringify(me));
  closeLoginModal();
  revealMemberUI();
};

let scheduleViewMode = 'month';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth(); // 0-indexed
let selectedDate = null;
let allSchedulesCache = [];

window.setScheduleView = function(mode){
  scheduleViewMode = mode;
  ['month','quarter','year'].forEach(m=>{
    document.getElementById('viewBtn-'+m).classList.toggle('view-active', m===mode);
  });
  renderScheduleList();
};

window.calMonthShift = function(delta){
  calMonth += delta;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  if(calMonth > 11){ calMonth = 0; calYear++; }
  renderCalendar();
};
window.calGoToday = function(){
  const now = new Date();
  calYear = now.getFullYear(); calMonth = now.getMonth();
  selectedDate = null;
  renderCalendar(); renderScheduleList();
};
window.selectCalDate = function(dateStr){
  selectedDate = (selectedDate === dateStr) ? null : dateStr;
  renderCalendar();
  renderScheduleList();
};

function renderCalendar(){
  const title = document.getElementById('calTitle');
  if(title) title.textContent = `${calYear}년 ${calMonth+1}월`;
  const firstDow = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const scheduleDates = new Set(
    allSchedulesCache
      .filter(s=>{ const [y,m] = s.date.split('-').map(Number); return y===calYear && m===calMonth+1; })
      .map(s=>s.date)
  );
  const todayStr = new Date().toISOString().slice(0,10);
  let html = ['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) html += `<div class="cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if(dateStr===todayStr) cls.push('today');
    if(dateStr===selectedDate) cls.push('selected');
    html += `<div class="${cls.join(' ')}" onclick="selectCalDate('${dateStr}')">
      <span>${d}</span>${scheduleDates.has(dateStr) ? '<span class="dot"></span>' : ''}
    </div>`;
  }
  const grid = document.getElementById('calGrid');
  if(grid) grid.innerHTML = html;
}

function groupKey(dateStr, mode){
  const [y,m] = dateStr.split('-').map(Number);
  if(mode==='year') return `${y}년`;
  if(mode==='quarter'){
    const block = Math.floor((m-1)/4); // 0:1~4월, 1:5~8월, 2:9~12월
    return `${y}년 ${block*4+1}~${block*4+4}월`;
  }
  return `${y}년 ${m}월`;
}

function renderScheduleList(){
  const el = document.getElementById('scheduleList');
  if(!el) return;
  if(!allSchedulesCache.length){ el.innerHTML = '<div class="empty">등록된 일정이 없어요.</div>'; return; }
  if(selectedDate){
    const items = allSchedulesCache.filter(s=>s.date===selectedDate);
    el.innerHTML =
      `<div class="group-header">${selectedDate} <span style="cursor:pointer;color:var(--gold);font-weight:400;text-transform:none;" onclick="selectCalDate('${selectedDate}')">· 전체보기</span></div>` +
      (items.length ? items.map(scheduleCard).join('') : '<div class="empty">이 날짜엔 일정이 없어요.</div>');
    return;
  }
  const groups = {};
  allSchedulesCache.forEach(s=>{
    const k = groupKey(s.date, scheduleViewMode);
    (groups[k] = groups[k] || []).push(s);
  });
  el.innerHTML = Object.entries(groups).map(([k, items])=>
    `<div class="group-header">${k}</div>${items.map(scheduleCard).join('')}`
  ).join('');
}

async function loadSchedules(){
  const { data } = await supabase.from('schedules').select('*').order('date', { ascending:true });
  allSchedulesCache = data || [];
  renderCalendar();
  renderScheduleList();
}

window.deleteNotice = async function(id){
  await supabase.from('notices').delete().eq('id', id);
  loadNotices(); loadNoticeAdminList();
};
async function loadNoticeAdminList(){
  const { data } = await supabase.from('notices').select('*').order('created_at', { ascending:false }).limit(10);
  document.getElementById('noticeAdminList').innerHTML = (data||[]).map(n=>`
    <div class="row" style="padding:6px 0;border-bottom:1px solid #f2f0e6;">
      <span style="flex:1;">${n.message}</span>
      <button class="btn small ghost" onclick="deleteNotice('${n.id}')">삭제</button>
    </div>`).join('');
}

window.setRole = async function(memberId, role){
  await supabase.rpc('set_member_role', { p_member_id: memberId, p_role: role });
  loadAdmin();
};
window.resetPassword = async function(memberId){
  await supabase.rpc('update_my_password', { p_member_id: memberId, p_new_password: '0001' });
  alert('0001로 초기화되었습니다.');
};
window.saveTierBounds = async function(){
  const value = {
    tier0_max: Number(document.getElementById('cfgT0').value),
    tier1_max: Number(document.getElementById('cfgT1').value),
    tier2_max: Number(document.getElementById('cfgT2').value),
  };
  await supabase.from('config').update({ value }).eq('key','tier_bounds');
  alert('저장되었습니다. (다음 스코어 등록부터 반영)');
};
